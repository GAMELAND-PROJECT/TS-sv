# ==============================================================================
# TeamSpeak 3 Server Enterprise Manager Configuration
# ==============================================================================

# System & Directories
TS_USER="teamspeak"
TS_GROUP="teamspeak"
TS_DIR="/opt/teamspeak"
TS_LOG_DIR="/opt/teamspeak/logs"
TS_CONF="/opt/teamspeak/ts3server.ini"

# Backup Settings
BACKUP_DIR="/opt/teamspeak/backups"
BACKUP_RETENTION_DAYS=14
AUTO_BACKUP_CRON="0 4 * * *" # Daily at 04:00 AM

# Watchdog & Auto-Healing
WATCHDOG_ENABLED=true
WATCHDOG_INTERVAL_SECONDS=60
WATCHDOG_LOG="/var/log/ts3-watchdog.log"
MAX_CPU_PERCENT=90
MAX_MEMORY_PERCENT=85

# Network Ports
PORT_VOICE=9987      # UDP
PORT_FILE=30033      # TCP
PORT_QUERY=10011     # TCP
PORT_QUERY_SSH=10022 # TCP

# Notifications (Leave empty if not using)
# Webhook format for Discord
DISCORD_WEBHOOK_URL=""

# Telegram Bot Alerts
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# Auto Updates
AUTO_UPDATE_CHECK=true
