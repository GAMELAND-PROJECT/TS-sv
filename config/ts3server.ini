# ==============================================================================
# TeamSpeak 3 Server Configuration File (ts3server.ini)
# Optimized for Ubuntu Linux Enterprise Deployments
# ==============================================================================

# Network Bindings & Voice Port
machine_id=
default_voice_port=9987
voice_ip=0.0.0.0
licensepath=
filetransfer_port=30033
filetransfer_ip=0.0.0.0
query_port=10011
query_ip=0.0.0.0
query_ip_whitelist=query_ip_whitelist.txt
query_ip_blacklist=query_ip_blacklist.txt
query_ssh_ip=0.0.0.0
query_ssh_port=10022
query_protocols=raw,ssh

# Database Configuration (SQLite default; reliable and self-contained)
dbsqlpath=sql/
dbplugin=ts3db_sqlite3
dbsqlcreatepath=create_sqlite/
dbconnections=10
dbclientkeepdays=90

# Logging & Performance
logpath=logs/
logquerycommands=0
logappend=1
clear_database=0

# Security
query_skipbandwidthlimit=0
