# ==============================================================================
# TeamSpeak 3 Server Configuration File (ts3server.ini)
# Optimized for Ubuntu Linux (Clean & Stable)
# ==============================================================================

# Network Bindings & Voice Port
machine_id=
default_voice_port=9987
voice_ip=0.0.0.0
licensepath=
filetransfer_port=30033
filetransfer_ip=0.0.0.0
query_port=10011
query_ip=0.0.0.0
query_ip_whitelist=query_ip_whitelist.txt
query_ip_blacklist=query_ip_blacklist.txt

# Database Configuration (Official SQLite Engine)
dbplugin=ts3db_sqlite3
dbpluginparameter=
dbsqlpath=sql/
dbsqlcreatepath=create_sqlite/
dbconnections=10
dbclientkeepdays=90

# Logging & Performance
logpath=logs/
logquerycommands=0
logappend=1
clear_database=0
query_skipbandwidthlimit=0
